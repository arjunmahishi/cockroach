name: "Queues"
description: "Internal queue processing metrics"

charts:
  - title: "GC Queue"
    type: "line"
    graph_type: "kv"
    sources: "stores"
    axis:
      label: "actions per second"
      units: "count"
    tooltip: "The number of GC queue actions per second {tooltipSelection}."
    show_metrics_in_tooltip: true
    metrics:
      - name: "cr.store.queue.gc.process.success"
        title: "Successful Actions"
        rate: true
      - name: "cr.store.queue.gc.process.failure"
        title: "Failed Actions"
        rate: true
      - name: "cr.store.queue.gc.pending"
        title: "Pending Actions"

